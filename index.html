<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0f11;
  --surface: #16181c;
  --surface2: #1e2026;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #f0ede8;
  --muted: #8a8a8e;
  --accent: #e8b84b;
  --accent2: #4b9ce8;
  --red: #e85a4b;
  --green: #4be8a0;
  --serif: 'DM Serif Display', Georgia, serif;
  --sans: 'DM Sans', system-ui, sans-serif;
  --mono: 'DM Mono', monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* HEADER */
header{position:sticky;top:0;z-index:200;background:rgba(14,15,17,0.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1440px;margin:0 auto;padding:0 2rem;display:flex;align-items:center;gap:2rem;height:56px}
.logo{font-family:var(--serif);font-size:1.5rem;letter-spacing:-0.01em;color:var(--text);white-space:nowrap}
.logo em{color:var(--accent);font-style:normal}
.header-meta{font-family:var(--mono);font-size:0.62rem;color:var(--muted);white-space:nowrap}
.live-dot{display:inline-block;width:6px;height:6px;background:var(--green);border-radius:50%;margin-right:6px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.search-wrap{flex:1;max-width:360px;position:relative}
.search-wrap input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:0.45rem 0.75rem 0.45rem 2.2rem;font-family:var(--sans);font-size:0.8rem;color:var(--text);outline:none;transition:border-color 0.2s}
.search-wrap input::placeholder{color:var(--muted)}
.search-wrap input:focus{border-color:var(--border2)}
.search-icon{position:absolute;left:0.6rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:0.85rem;pointer-events:none}
.refresh-btn{margin-left:auto;background:none;border:1px solid var(--border);border-radius:8px;padding:0.4rem 0.9rem;font-family:var(--mono);font-size:0.65rem;letter-spacing:0.06em;color:var(--muted);cursor:pointer;transition:all 0.2s;white-space:nowrap}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
.refresh-btn.spinning svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* THEME NAV */
.theme-nav{background:var(--surface);border-bottom:1px solid var(--border)}
.theme-nav-inner{max-width:1440px;margin:0 auto;padding:0 2rem;display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
.theme-nav-inner::-webkit-scrollbar{display:none}
.theme-btn{flex-shrink:0;font-family:var(--mono);font-size:0.65rem;font-weight:500;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;padding:0.85rem 1.1rem;cursor:pointer;transition:all 0.2s;white-space:nowrap}
.theme-btn:hover{color:var(--text)}
.theme-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* STATS BAR */
.stats-bar{max-width:1440px;margin:0 auto;padding:1.25rem 2rem 0;display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap}
.stat-chip{display:flex;align-items:center;gap:0.5rem;font-family:var(--mono);font-size:0.65rem}
.stat-num{font-size:1.1rem;font-weight:500;color:var(--accent)}
.stat-label{color:var(--muted)}
.stat-divider{width:1px;height:20px;background:var(--border)}

/* STATUS */
.status-msg{max-width:1440px;margin:1rem 2rem;display:flex;align-items:center;gap:0.75rem;padding:0.75rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-family:var(--mono);font-size:0.7rem;color:var(--muted)}
.status-msg.hidden{display:none}
.spinner-sm{width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0}

/* GRID */
.main{max-width:1440px;margin:0 auto;padding:1.5rem 2rem 6rem}
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.25rem}

/* SOURCE CARD */
.source-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color 0.2s}
.source-card:hover{border-color:var(--border2)}
.card-header{padding:1rem 1.25rem 0.75rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.source-name{font-family:var(--mono);font-size:0.65rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent)}
.source-badge{font-family:var(--mono);font-size:0.6rem;color:var(--muted);background:var(--surface2);padding:0.2rem 0.5rem;border-radius:4px}
.card-articles{padding:0.25rem 0}
.article-item{padding:0.75rem 1.25rem;border-bottom:1px solid var(--border);transition:background 0.15s;cursor:pointer}
.article-item:last-child{border-bottom:none}
.article-item:hover{background:var(--surface2)}
.article-title{font-family:var(--serif);font-size:0.92rem;line-height:1.4;color:var(--text);text-decoration:none;display:block;margin-bottom:0.3rem}
.article-title:hover{color:var(--accent)}
.article-desc{font-size:0.74rem;color:var(--muted);line-height:1.5;margin-bottom:0.4rem;font-weight:300}
.article-footer{display:flex;align-items:center;gap:0.5rem}
.article-time{font-family:var(--mono);font-size:0.6rem;color:var(--muted)}
.theme-pill{font-family:var(--mono);font-size:0.58rem;padding:0.15rem 0.45rem;border-radius:4px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}

/* FEATURED (first card) */
.source-card.featured{grid-column:span 2}
@media(max-width:700px){.source-card.featured{grid-column:span 1}}
.featured .article-title{font-size:1.1rem}

/* EMPTY */
.empty{grid-column:1/-1;text-align:center;padding:5rem 2rem;color:var(--muted);font-family:var(--mono);font-size:0.8rem}

/* ERROR CARD */
.error-item{padding:0.75rem 1.25rem;font-family:var(--mono);font-size:0.68rem;color:var(--red)}

/* MOBILE */
@media(max-width:600px){
  .header-inner{padding:0 1rem;gap:1rem}
  .search-wrap{display:none}
  .main{padding:1rem 1rem 5rem}
  .stats-bar{padding:1rem 1rem 0}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Briefing<em>.</em></div>
    <div class="header-meta">
      <span class="live-dot"></span>
      <span id="time-display">—</span>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Pesquisar notícias…">
    </div>
    <button class="refresh-btn" id="refresh-btn">
      <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:-1px;margin-right:4px"><path d="M1 8a7 7 0 1 0 7-7"/><path d="M1 3v5h5"/></svg>
      Atualizar
    </button>
  </div>
</header>

<nav class="theme-nav">
  <div class="theme-nav-inner" id="theme-nav">
    <button class="theme-btn active" data-theme="all">Tudo</button>
    <button class="theme-btn" data-theme="macro">Macro &amp; Mercados</button>
    <button class="theme-btn" data-theme="micro">Micro &amp; Finanças</button>
    <button class="theme-btn" data-theme="intl">Política Internacional</button>
    <button class="theme-btn" data-theme="inovacao">Inovação &amp; Empresas</button>
    <button class="theme-btn" data-theme="pt-economia">Economia PT</button>
    <button class="theme-btn" data-theme="pt-politica">Política PT</button>
  </div>
</nav>

<div class="stats-bar" id="stats-bar" style="display:none">
  <div class="stat-chip"><span class="stat-num" id="stat-articles">0</span><span class="stat-label">artigos</span></div>
  <div class="stat-divider"></div>
  <div class="stat-chip"><span class="stat-num" id="stat-sources">0</span><span class="stat-label">fontes activas</span></div>
  <div class="stat-divider"></div>
  <div class="stat-chip"><span class="stat-label">Actualizado</span><span class="stat-num" style="font-size:0.8rem;margin-left:4px" id="stat-updated">—</span></div>
</div>

<div class="status-msg" id="status-msg">
  <div class="spinner-sm"></div>
  <span id="status-text">A carregar notícias…</span>
</div>

<main class="main">
  <div class="news-grid" id="news-grid"></div>
</main>

<script>
const API_KEY = 'afac210204fc405e8107dc5c4d620523';
const BASE = 'https://newsapi.org/v2/';

const QUERIES = [
  { id:'macro',     label:'Macro & Mercados',        q:'economy OR markets OR inflation OR GDP OR "interest rates" OR "central bank"',                         domains:'reuters.com,bloomberg.com,ft.com,wsj.com,economist.com,marketwatch.com,lesechos.fr,handelsblatt.com,ilsole24ore.com,project-syndicate.org' },
  { id:'micro',     label:'Micro & Finanças',         q:'corporate earnings OR mergers OR IPO OR "private equity" OR banking OR fintech',                       domains:'reuters.com,ft.com,bloomberg.com,hbr.org,bruegel.org,wsj.com,marketwatch.com' },
  { id:'intl',      label:'Política Internacional',   q:'geopolitics OR diplomacy OR "foreign policy" OR NATO OR sanctions OR "international relations"',       domains:'reuters.com,foreignaffairs.com,euronews.com,economist.com,ft.com,project-syndicate.org' },
  { id:'inovacao',  label:'Inovação & Empresas',      q:'artificial intelligence OR technology OR startup OR innovation OR semiconductor OR "machine learning"', domains:'techcrunch.com,technologyreview.com,reuters.com,ft.com' },
  { id:'pt-economia',label:'Economia Portuguesa',    q:'Portugal economy OR "economia portuguesa" OR "banco de portugal" OR "orçamento portugal"',              domains:'jornaldenegocios.pt,eco.pt,expresso.pt,publico.pt' },
  { id:'pt-politica',label:'Política Portuguesa',    q:'Portugal politics OR "política portuguesa" OR "governo portugal" OR "assembleia da república"',         domains:'publico.pt,expresso.pt,jornaldenegocios.pt' },
];

const THEME_LABELS = {all:'Tudo',macro:'Macro & Mercados',micro:'Micro & Finanças',intl:'Política Internacional',inovacao:'Inovação & Empresas','pt-economia':'Economia PT','pt-politica':'Política PT'};

let allData = {};
let currentTheme = 'all';
let searchQuery = '';

function timeAgo(d) {
  if (!d) return '';
  const diff = (Date.now() - new Date(d)) / 1000;
  if (diff < 60) return 'agora';
  if (diff < 3600) return `${Math.floor(diff/60)}min`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h`;
  return `${Math.floor(diff/86400)}d`;
}

function truncate(str, n) {
  if (!str) return '';
  const clean = str.replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
  return clean.length > n ? clean.slice(0,n) + '…' : clean;
}

async function fetchTheme(theme) {
  try {
    const url = `${BASE}everything?q=${encodeURIComponent(theme.q)}&domains=${theme.domains}&language=en&sortBy=publishedAt&pageSize=20&apiKey=${API_KEY}`;
    const r = await fetch(url);
    const d = await r.json();
    if (d.status !== 'ok') throw new Error(d.message || 'API error');
    return { id: theme.id, label: theme.label, articles: d.articles || [] };
  } catch(e) {
    return { id: theme.id, label: theme.label, articles: [], error: e.message };
  }
}

async function fetchPortuguese() {
  try {
    const url = `${BASE}top-headlines?country=pt&pageSize=20&apiKey=${API_KEY}`;
    const r = await fetch(url);
    const d = await r.json();
    if (d.status !== 'ok') throw new Error(d.message);
    return d.articles || [];
  } catch(e) {
    return [];
  }
}

async function loadAll() {
  setStatus('A carregar notícias…', true);
  document.getElementById('stats-bar').style.display = 'none';
  setBtnSpinning(true);

  const results = await Promise.allSettled(QUERIES.map(fetchTheme));
  const ptArticles = await fetchPortuguese();

  allData = {};
  results.forEach(r => {
    if (r.status === 'fulfilled') {
      allData[r.value.id] = r.value;
    }
  });

  if (ptArticles.length) {
    const ptEco = allData['pt-economia'] || { id:'pt-economia', label:'Economia PT', articles:[] };
    ptEco.articles = [...ptArticles, ...ptEco.articles].slice(0, 25);
    allData['pt-economia'] = ptEco;
    const ptPol = allData['pt-politica'] || { id:'pt-politica', label:'Política PT', articles:[] };
    ptPol.articles = [...ptArticles, ...ptPol.articles].slice(0, 25);
    allData['pt-politica'] = ptPol;
  }

  document.getElementById('stat-updated').textContent =
    new Date().toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' });

  setStatus('', false);
  setBtnSpinning(false);
  document.getElementById('stats-bar').style.display = 'flex';
  render();
}

function getArticles() {
  let articles = [];
  if (currentTheme === 'all') {
    Object.values(allData).forEach(d => {
      d.articles.forEach(a => articles.push({ ...a, _theme: d.id, _themeLabel: d.label }));
    });
  } else if (allData[currentTheme]) {
    articles = allData[currentTheme].articles.map(a => ({
      ...a, _theme: currentTheme, _themeLabel: THEME_LABELS[currentTheme]
    }));
  }

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    articles = articles.filter(a =>
      (a.title||'').toLowerCase().includes(q) ||
      (a.description||'').toLowerCase().includes(q) ||
      (a.source?.name||'').toLowerCase().includes(q)
    );
  }

  const seen = new Set();
  return articles.filter(a => {
    if (!a.title || seen.has(a.title)) return false;
    seen.add(a.title);
    return true;
  }).sort((a,b) => new Date(b.publishedAt) - new Date(a.publishedAt));
}

function render() {
  const grid = document.getElementById('news-grid');
  grid.innerHTML = '';
  const articles = getArticles();

  document.getElementById('stat-articles').textContent = articles.length;

  const bySrc = {};
  articles.forEach(a => {
    const src = a.source?.name || 'Desconhecido';
    if (!bySrc[src]) bySrc[src] = [];
    bySrc[src].push(a);
  });

  const sources = Object.entries(bySrc);
  document.getElementById('stat-sources').textContent = sources.length;

  if (sources.length === 0) {
    grid.innerHTML = '<div class="empty">Sem notícias para este filtro.</div>';
    return;
  }

  sources.forEach(([srcName, arts], i) => {
    const card = document.createElement('div');
    card.className = 'source-card' + (i === 0 ? ' featured' : '');

    const header = document.createElement('div');
    header.className = 'card-header';
    header.innerHTML = `<span class="source-name">${srcName}</span><span class="source-badge">${arts.length} artigos</span>`;
    card.appendChild(header);

    const body = document.createElement('div');
    body.className = 'card-articles';

    const limit = i === 0 ? 5 : 4;
    arts.slice(0, limit).forEach(a => {
      const item = document.createElement('div');
      item.className = 'article-item';
      const desc = truncate(a.description, 120);
      item.innerHTML = `
        <a class="article-title" href="${a.url}" target="_blank" rel="noopener">${a.title}</a>
        ${desc ? `<div class="article-desc">${desc}</div>` : ''}
        <div class="article-footer">
          <span class="article-time">${timeAgo(a.publishedAt)}</span>
          ${a._themeLabel ? `<span class="theme-pill">${a._themeLabel}</span>` : ''}
        </div>
      `;
      body.appendChild(item);
    });

    if (allData[currentTheme === 'all' ? arts[0]._theme : currentTheme]?.error) {
      const err = document.createElement('div');
      err.className = 'error-item';
      err.textContent = '⚠ Erro ao carregar esta fonte';
      body.appendChild(err);
    }

    card.appendChild(body);
    grid.appendChild(card);
  });
}

function setStatus(msg, show) {
  const el = document.getElementById('status-msg');
  const txt = document.getElementById('status-text');
  el.classList.toggle('hidden', !show);
  if (show) txt.textContent = msg;
}

function setBtnSpinning(s) {
  document.getElementById('refresh-btn').classList.toggle('spinning', s);
}

function updateClock() {
  const now = new Date();
  document.getElementById('time-display').textContent =
    now.toLocaleDateString('pt-PT', { weekday:'short', day:'numeric', month:'short' }) + ' · ' +
    now.toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' });
}

document.getElementById('theme-nav').addEventListener('click', e => {
  const btn = e.target.closest('.theme-btn');
  if (!btn) return;
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTheme = btn.dataset.theme;
  render();
});

document.getElementById('refresh-btn').addEventListener('click', loadAll);

document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

updateClock();
setInterval(updateClock, 30000);
setInterval(loadAll, 30 * 60 * 1000);
loadAll();
</script>
</body>
</html>
