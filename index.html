<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0d0f;
  --surface: #141519;
  --surface2: #1c1e24;
  --surface3: #22252d;
  --border: rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.11);
  --text: #ededeb;
  --muted: #7a7a80;
  --muted2: #55555c;
  --accent: #e6b84a;
  --accent2: #5b9cf6;
  --green: #4ade80;
  --red: #f87171;
  --serif: 'DM Serif Display', Georgia, serif;
  --sans: 'DM Sans', system-ui, sans-serif;
  --mono: 'DM Mono', monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:14px}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:200;background:rgba(12,13,15,0.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1480px;margin:0 auto;padding:0 1.75rem;display:flex;align-items:center;gap:1.5rem;height:52px}
.logo{font-family:var(--serif);font-size:1.45rem;color:var(--text);white-space:nowrap;letter-spacing:-0.01em}
.logo span{color:var(--accent)}
.live-badge{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:0.6rem;color:var(--green);letter-spacing:0.08em}
.dot{width:5px;height:5px;background:var(--green);border-radius:50%;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.header-date{font-family:var(--mono);font-size:0.62rem;color:var(--muted);white-space:nowrap}
.search-box{flex:1;max-width:320px;position:relative;margin-left:auto}
.search-box input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:0.42rem 0.75rem 0.42rem 2rem;font-family:var(--sans);font-size:0.8rem;color:var(--text);outline:none;transition:border-color 0.2s}
.search-box input:focus{border-color:var(--border2);background:var(--surface3)}
.search-box input::placeholder{color:var(--muted2)}
.search-ico{position:absolute;left:0.55rem;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.refresh-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:0.38rem 0.85rem;font-family:var(--mono);font-size:0.62rem;letter-spacing:0.05em;color:var(--muted);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
.refresh-btn svg{transition:transform 0.6s}
.refresh-btn.loading svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── THEME NAV ── */
.theme-nav{background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.theme-nav::-webkit-scrollbar{display:none}
.theme-nav-inner{max-width:1480px;margin:0 auto;padding:0 1.75rem;display:flex}
.tbtn{flex-shrink:0;font-family:var(--mono);font-size:0.62rem;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;padding:0.8rem 1rem;cursor:pointer;transition:all 0.18s;white-space:nowrap}
.tbtn:hover{color:var(--text)}
.tbtn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── STATS ── */
.statsbar{max-width:1480px;margin:0 auto;padding:1.1rem 1.75rem 0;display:flex;gap:1.25rem;align-items:center;flex-wrap:wrap;opacity:0;transition:opacity 0.4s}
.statsbar.visible{opacity:1}
.stat{display:flex;align-items:baseline;gap:5px;font-family:var(--mono);font-size:0.62rem}
.stat-n{font-size:1.05rem;font-weight:500;color:var(--accent)}
.stat-l{color:var(--muted)}
.divider{width:1px;height:16px;background:var(--border2)}

/* ── LOADER ── */
.loader{max-width:1480px;margin:1rem 1.75rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0.7rem 1rem;display:flex;align-items:center;gap:0.6rem;font-family:var(--mono);font-size:0.68rem;color:var(--muted)}
.loader.hidden{display:none}
.spin-sm{width:13px;height:13px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0}

/* ── GRID ── */
.grid-wrap{max-width:1480px;margin:0 auto;padding:1.25rem 1.75rem 5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1rem}

/* ── CARD ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color 0.2s,transform 0.2s}
.card:hover{border-color:var(--border2);transform:translateY(-1px)}
.card.wide{grid-column:span 2}
@media(max-width:680px){.card.wide{grid-column:span 1}}
.card-head{padding:0.85rem 1.1rem 0.7rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
.src-label{font-family:var(--mono);font-size:0.6rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent)}
.src-count{font-family:var(--mono);font-size:0.58rem;color:var(--muted2);background:var(--surface2);padding:0.18rem 0.45rem;border-radius:4px}
.card-body{padding:0.15rem 0}

/* ── ARTICLE ── */
.art{padding:0.7rem 1.1rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s}
.art:last-child{border-bottom:none}
.art:hover{background:var(--surface2)}
.art-title{font-family:var(--serif);font-size:0.9rem;line-height:1.38;color:var(--text);text-decoration:none;display:block;margin-bottom:0.28rem}
.art-title:hover{color:var(--accent)}
.art-desc{font-size:0.73rem;color:var(--muted);line-height:1.5;margin-bottom:0.3rem;font-weight:300;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art-meta{display:flex;align-items:center;gap:0.45rem;flex-wrap:wrap}
.art-time{font-family:var(--mono);font-size:0.58rem;color:var(--muted2)}
.art-tag{font-family:var(--mono);font-size:0.56rem;padding:0.12rem 0.4rem;border-radius:3px;background:var(--surface3);color:var(--muted);border:1px solid var(--border)}

/* ── EMPTY ── */
.empty{grid-column:1/-1;padding:5rem 2rem;text-align:center;font-family:var(--mono);font-size:0.75rem;color:var(--muted)}

/* ── MOBILE ── */
@media(max-width:580px){
  .header-inner{padding:0 1rem;gap:0.75rem}
  .search-box,.header-date{display:none}
  .grid-wrap{padding:1rem 1rem 5rem}
  .statsbar{padding:0.85rem 1rem 0}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Briefing<span>.</span></div>
    <div class="live-badge"><span class="dot"></span>LIVE</div>
    <div class="header-date" id="hdate">—</div>
    <div class="search-box">
      <svg class="search-ico" viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="4"/><line x1="10" y1="10" x2="14" y2="14"/></svg>
      <input type="text" id="search" placeholder="Pesquisar…">
    </div>
    <button class="refresh-btn" id="rbtn">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M1.5 8A6.5 6.5 0 1 0 8 1.5"/><polyline points="1.5,1.5 1.5,8 8,8"/></svg>
      Atualizar
    </button>
  </div>
</header>

<nav class="theme-nav">
  <div class="theme-nav-inner" id="tnav">
    <button class="tbtn active" data-t="all">Tudo</button>
    <button class="tbtn" data-t="macro">Macro &amp; Mercados</button>
    <button class="tbtn" data-t="micro">Micro &amp; Finanças</button>
    <button class="tbtn" data-t="intl">Política Internacional</button>
    <button class="tbtn" data-t="inov">Inovação &amp; Empresas</button>
    <button class="tbtn" data-t="pteco">Economia PT</button>
    <button class="tbtn" data-t="ptpol">Política PT</button>
  </div>
</nav>

<div class="statsbar" id="stats">
  <div class="stat"><span class="stat-n" id="sart">0</span><span class="stat-l">artigos</span></div>
  <div class="divider"></div>
  <div class="stat"><span class="stat-n" id="ssrc">0</span><span class="stat-l">fontes</span></div>
  <div class="divider"></div>
  <div class="stat"><span class="stat-l">actualizado</span>&nbsp;<span class="stat-n" style="font-size:0.78rem" id="supd">—</span></div>
</div>

<div class="loader" id="loader"><div class="spin-sm"></div><span id="ltxt">A carregar notícias…</span></div>

<div class="grid-wrap"><div class="grid" id="grid"></div></div>

<script>
const PROXY = 'https://api.rss2json.com/v1/api.json?rss_url=';

// Google News RSS — funciona sem bloqueios CORS via rss2json
// Formato: https://news.google.com/rss/search?q=QUERY&hl=en&gl=US&ceid=US:en
// Para PT: hl=pt-PT&gl=PT&ceid=PT:pt

function gnews(query, lang='en', country='US') {
  const base = `https://news.google.com/rss/search?q=${encodeURIComponent(query)}&hl=${lang}&gl=${country}&ceid=${country}:${lang}`;
  return PROXY + encodeURIComponent(base) + '&count=12';
}

function gnewsSrc(site, lang='en', country='US') {
  return gnews(`site:${site}`, lang, country);
}

const FEEDS = [
  // ── MACRO & MERCADOS ──
  { id:'reuters-mkts',  label:'Reuters Markets',      url:gnews('markets economy inflation GDP "interest rates" site:reuters.com'), themes:['macro'] },
  { id:'ft-econ',       label:'Financial Times',       url:gnews('economy markets finance site:ft.com'), themes:['macro','micro'] },
  { id:'economist',     label:'The Economist',         url:gnews('economy finance site:economist.com'), themes:['macro','intl'] },
  { id:'bloomberg',     label:'Bloomberg',             url:gnews('markets economy finance site:bloomberg.com'), themes:['macro'] },
  { id:'wsj',           label:'Wall Street Journal',   url:gnews('markets economy site:wsj.com'), themes:['macro'] },
  { id:'marketwatch',   label:'MarketWatch',           url:gnewsSrc('marketwatch.com'), themes:['macro'] },
  { id:'project-synd',  label:'Project Syndicate',     url:gnewsSrc('project-syndicate.org'), themes:['macro','intl'] },
  { id:'bruegel',       label:'Bruegel',               url:gnewsSrc('bruegel.org'), themes:['macro','micro'] },
  { id:'lesechos',      label:'Les Échos',             url:gnews('économie finance marchés site:lesechos.fr','fr','FR'), themes:['macro'] },
  { id:'handelsblatt',  label:'Handelsblatt',          url:gnews('Wirtschaft Märkte site:handelsblatt.com','de','DE'), themes:['macro'] },
  { id:'ilsole',        label:'Il Sole 24 Ore',        url:gnews('economia mercati site:ilsole24ore.com','it','IT'), themes:['macro'] },

  // ── MICRO & FINANÇAS ──
  { id:'hbr',           label:'Harvard Business Review', url:gnewsSrc('hbr.org'), themes:['micro'] },
  { id:'reuters-biz',   label:'Reuters Business',     url:gnews('corporate mergers banking fintech site:reuters.com'), themes:['micro'] },

  // ── POLÍTICA INTERNACIONAL ──
  { id:'foreign-aff',   label:'Foreign Affairs',       url:gnewsSrc('foreignaffairs.com'), themes:['intl'] },
  { id:'euronews',      label:'Euronews',              url:gnews('geopolitics diplomacy Europe site:euronews.com'), themes:['intl'] },
  { id:'reuters-intl',  label:'Reuters World',         url:gnews('geopolitics diplomacy sanctions NATO site:reuters.com'), themes:['intl'] },

  // ── INOVAÇÃO & EMPRESAS ──
  { id:'techcrunch',    label:'TechCrunch',            url:gnewsSrc('techcrunch.com'), themes:['inov'] },
  { id:'mittr',         label:'MIT Tech Review',       url:gnewsSrc('technologyreview.com'), themes:['inov'] },
  { id:'ft-tech',       label:'FT Technology',         url:gnews('technology AI startups site:ft.com'), themes:['inov'] },

  // ── ECONOMIA PT ──
  { id:'jn',            label:'Jornal de Negócios',    url:gnewsSrc('jornaldenegocios.pt','pt','PT'), themes:['pteco'] },
  { id:'eco',           label:'ECO',                   url:gnewsSrc('eco.pt','pt','PT'), themes:['pteco'] },
  { id:'expresso-eco',  label:'Expresso Economia',     url:gnews('economia finanças site:expresso.pt','pt','PT'), themes:['pteco','ptpol'] },
  { id:'publico-eco',   label:'Público Economia',      url:gnews('economia Portugal site:publico.pt','pt','PT'), themes:['pteco'] },
  { id:'je',            label:'Jornal Económico',      url:gnewsSrc('jornaleconomico.pt','pt','PT'), themes:['pteco'] },

  // ── POLÍTICA PT ──
  { id:'publico-pol',   label:'Público',               url:gnews('política governo Portugal site:publico.pt','pt','PT'), themes:['ptpol'] },
  { id:'expresso-pol',  label:'Expresso',              url:gnews('política governo site:expresso.pt','pt','PT'), themes:['ptpol'] },
];

const THEME_LABELS = {
  all:'Tudo', macro:'Macro & Mercados', micro:'Micro & Finanças',
  intl:'Política Internacional', inov:'Inovação & Empresas',
  pteco:'Economia PT', ptpol:'Política PT'
};

let cache = {};
let activeTheme = 'all';
let searchQ = '';

async function loadFeed(feed) {
  try {
    const res = await fetch(feed.url, { signal: AbortSignal.timeout(9000) });
    const d = await res.json();
    if (d.status !== 'ok') throw new Error(d.message);
    return { ...feed, items: (d.items || []).slice(0, 10) };
  } catch(e) {
    return { ...feed, items: [], error: true };
  }
}

async function loadAll() {
  setLoader(true, 'A carregar notícias…');
  document.getElementById('rbtn').classList.add('loading');
  document.getElementById('stats').classList.remove('visible');

  const results = await Promise.allSettled(FEEDS.map(loadFeed));
  cache = {};
  results.forEach(r => {
    if (r.status === 'fulfilled' && r.value.items.length > 0) {
      cache[r.value.id] = r.value;
    }
  });

  document.getElementById('supd').textContent =
    new Date().toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' });

  setLoader(false);
  document.getElementById('rbtn').classList.remove('loading');
  document.getElementById('stats').classList.add('visible');
  render();
}

function getVisible() {
  let feeds = Object.values(cache);
  if (activeTheme !== 'all') feeds = feeds.filter(f => f.themes.includes(activeTheme));

  if (searchQ) {
    const q = searchQ.toLowerCase();
    feeds = feeds.map(f => ({
      ...f,
      items: f.items.filter(i =>
        (i.title||'').toLowerCase().includes(q) ||
        (i.description||'').toLowerCase().includes(q)
      )
    })).filter(f => f.items.length > 0);
  }

  return feeds.sort((a,b) => {
    const ta = new Date(a.items[0]?.pubDate || 0);
    const tb = new Date(b.items[0]?.pubDate || 0);
    return tb - ta;
  });
}

function timeAgo(d) {
  if (!d) return '';
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 60) return 'agora';
  if (s < 3600) return Math.floor(s/60) + 'min';
  if (s < 86400) return Math.floor(s/3600) + 'h';
  return Math.floor(s/86400) + 'd';
}

function stripHtml(s) {
  const d = document.createElement('div');
  d.innerHTML = s || '';
  return d.textContent.replace(/\s+/g,' ').trim();
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const feeds = getVisible();

  let totalArts = 0;
  feeds.forEach(f => totalArts += f.items.length);
  document.getElementById('sart').textContent = totalArts;
  document.getElementById('ssrc').textContent = feeds.length;

  if (feeds.length === 0) {
    grid.innerHTML = '<div class="empty">Sem resultados para este filtro.</div>';
    return;
  }

  feeds.forEach((feed, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (i === 0 ? ' wide' : '');

    const head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML = `<span class="src-label">${feed.label}</span><span class="src-count">${feed.items.length}</span>`;
    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'card-body';

    const limit = i === 0 ? 6 : 4;
    feed.items.slice(0, limit).forEach(item => {
      const a = document.createElement('div');
      a.className = 'art';
      const desc = stripHtml(item.description).slice(0, 130);
      const tag = THEME_LABELS[feed.themes[0]] || '';
      a.innerHTML = `
        <a class="art-title" href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
        ${desc ? `<div class="art-desc">${desc}…</div>` : ''}
        <div class="art-meta">
          <span class="art-time">${timeAgo(item.pubDate)}</span>
          ${tag ? `<span class="art-tag">${tag}</span>` : ''}
        </div>`;
      body.appendChild(a);
    });

    card.appendChild(body);
    grid.appendChild(card);
  });
}

function setLoader(show, msg) {
  const el = document.getElementById('loader');
  el.classList.toggle('hidden', !show);
  if (msg) document.getElementById('ltxt').textContent = msg;
}

// Clock
function tick() {
  document.getElementById('hdate').textContent =
    new Date().toLocaleDateString('pt-PT', { weekday:'short', day:'numeric', month:'short' }) + ' · ' +
    new Date().toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' });
}
tick();
setInterval(tick, 30000);

// Events
document.getElementById('tnav').addEventListener('click', e => {
  const btn = e.target.closest('.tbtn');
  if (!btn) return;
  document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeTheme = btn.dataset.t;
  render();
});

document.getElementById('rbtn').addEventListener('click', loadAll);

document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value.trim();
  render();
});

// Auto-refresh 30min
setInterval(loadAll, 30 * 60 * 1000);

loadAll();
</script>
</body>
</html>
