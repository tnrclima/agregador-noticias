<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f0e8;--surface:#faf7f2;--surface2:#ede8df;--surface3:#e4ddd2;
  --border:#d8d0c4;--border2:#c8bfb0;
  --ink:#1a1714;--ink2:#4a4540;--ink3:#8a8078;
  --accent:#b5440c;--gold:#c8902a;--green:#2d7a4a;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);overflow-x:hidden;font-size:14px}

header{position:sticky;top:0;z-index:300;background:rgba(245,240,232,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1480px;margin:0 auto;padding:0 1.75rem;display:flex;align-items:center;gap:1.25rem;height:52px}
.logo{font-family:var(--serif);font-size:1.5rem;color:var(--ink);white-space:nowrap;letter-spacing:-0.01em;font-weight:600}
.logo span{color:var(--accent)}
.live-badge{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:0.58rem;color:var(--green);letter-spacing:0.1em;white-space:nowrap}
.dot{width:5px;height:5px;background:var(--green);border-radius:50%;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}
.header-date{font-family:var(--mono);font-size:0.62rem;color:var(--ink3);white-space:nowrap}
.search-box{flex:1;max-width:300px;margin-left:auto;position:relative}
.search-box input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:0.4rem 0.75rem 0.4rem 2rem;font-family:var(--sans);font-size:0.8rem;color:var(--ink);outline:none;transition:border-color 0.2s}
.search-box input:focus{border-color:var(--border2);background:var(--surface)}
.search-box input::placeholder{color:var(--ink3)}
.search-ico{position:absolute;left:0.55rem;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--ink3);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.refresh-btn{background:none;border:1px solid var(--border);border-radius:7px;padding:0.36rem 0.85rem;font-family:var(--mono);font-size:0.6rem;letter-spacing:0.05em;color:var(--ink3);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
.refresh-btn.loading svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.theme-nav{background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.theme-nav::-webkit-scrollbar{display:none}
.theme-nav-inner{max-width:1480px;margin:0 auto;padding:0 1.75rem;display:flex}
.tbtn{flex-shrink:0;font-family:var(--mono);font-size:0.6rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink3);background:none;border:none;border-bottom:2px solid transparent;padding:0.8rem 1rem;cursor:pointer;transition:all 0.18s;white-space:nowrap}
.tbtn:hover{color:var(--ink)}
.tbtn.active{color:var(--accent);border-bottom-color:var(--accent)}

.statsbar{max-width:1480px;margin:0 auto;padding:1.1rem 1.75rem 0;display:flex;gap:1.25rem;align-items:center;flex-wrap:wrap;opacity:0;transition:opacity 0.5s}
.statsbar.visible{opacity:1}
.stat{display:flex;align-items:baseline;gap:5px;font-family:var(--mono);font-size:0.6rem}
.stat-n{font-size:1rem;font-weight:500;color:var(--accent)}
.stat-l{color:var(--ink3)}
.sdivider{width:1px;height:14px;background:var(--border)}

.loader{max-width:1480px;margin:1rem 1.75rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0.65rem 1rem;display:flex;align-items:center;gap:0.6rem;font-family:var(--mono);font-size:0.66rem;color:var(--ink3)}
.loader.hidden{display:none}
.spin-sm{width:13px;height:13px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0}
.progress-bar-wrap{flex:1;height:3px;background:var(--surface3);border-radius:2px;overflow:hidden;margin-left:0.5rem}
.progress-bar{height:100%;background:var(--accent);border-radius:2px;transition:width 0.3s ease;width:0%}

.grid-wrap{max-width:1480px;margin:0 auto;padding:1.25rem 1.75rem 5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1rem}

.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color 0.2s,box-shadow 0.2s,transform 0.2s;animation:fadeUp 0.3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card:hover{border-color:var(--border2);box-shadow:0 2px 12px rgba(0,0,0,0.07);transform:translateY(-1px)}
.card.wide{grid-column:span 2}
@media(max-width:680px){.card.wide{grid-column:span 1}}
.card-head{padding:0.8rem 1.1rem 0.65rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:0.5rem;background:var(--surface2)}
.src-label{font-family:var(--mono);font-size:0.58rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent)}
.src-count{font-family:var(--mono);font-size:0.56rem;color:var(--ink3);background:var(--surface3);padding:0.15rem 0.4rem;border-radius:3px}
.card-body{padding:0.1rem 0}

.art{padding:0.7rem 1.1rem 0.6rem;border-bottom:1px solid var(--border);transition:background 0.15s;cursor:pointer}
.art:last-child{border-bottom:none}
.art:hover{background:var(--surface2)}
.art-title{font-family:var(--serif);font-size:0.9rem;line-height:1.38;color:var(--ink);display:block;margin-bottom:0.3rem}
.art-desc{font-size:0.72rem;color:var(--ink2);line-height:1.5;margin-bottom:0.35rem;font-weight:300;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art-footer{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap}
.art-time{font-family:var(--mono);font-size:0.57rem;color:var(--ink3)}
.art-tag{font-family:var(--mono);font-size:0.54rem;padding:0.1rem 0.38rem;border-radius:3px;background:#e8e0d4;color:var(--ink3);border:1px solid var(--border)}
.art-read-btn{margin-left:auto;font-family:var(--mono);font-size:0.62rem;font-weight:500;padding:0.25rem 0.65rem;border-radius:5px;background:var(--accent);color:#fff;border:none;cursor:pointer;transition:background 0.15s;letter-spacing:0.02em;white-space:nowrap}
.art-read-btn:hover{background:#8a3008}

/* DRAWER */
.drawer-overlay{position:fixed;inset:0;background:rgba(26,23,20,0.4);z-index:400;opacity:0;pointer-events:none;transition:opacity 0.25s;backdrop-filter:blur(3px)}
.drawer-overlay.open{opacity:1;pointer-events:all}
.drawer{position:fixed;top:0;right:-520px;width:min(520px,100vw);height:100%;background:var(--surface);border-left:1px solid var(--border);z-index:500;display:flex;flex-direction:column;transition:right 0.3s cubic-bezier(0.4,0,0.2,1)}
.drawer.open{right:0}
.drawer-head{padding:1.1rem 1.25rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:0.75rem;background:var(--surface2);flex-shrink:0}
.drawer-source{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);margin-bottom:0.35rem}
.drawer-title{font-family:var(--serif);font-size:1.1rem;line-height:1.4;color:var(--ink);font-weight:600}
.drawer-close{background:none;border:1px solid var(--border);border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--ink3);font-size:1rem;transition:all 0.15s;margin-top:2px}
.drawer-close:hover{border-color:var(--border2);color:var(--ink);background:var(--surface3)}
.drawer-body{flex:1;overflow-y:auto;padding:1.35rem 1.25rem}
.drawer-meta{font-family:var(--mono);font-size:0.6rem;color:var(--ink3);margin-bottom:1.25rem;display:flex;gap:0.75rem;flex-wrap:wrap}
.drawer-meta-item{display:flex;align-items:center;gap:4px}
.drawer-content{font-size:0.9rem;color:var(--ink2);line-height:1.75;font-weight:300}
.drawer-content p{margin-bottom:0.85rem}
.drawer-content p:last-child{margin-bottom:0}
.drawer-divider{border:none;border-top:1px solid var(--border);margin:1.25rem 0}
.drawer-label{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:0.6rem}
.drawer-footer{padding:1rem 1.25rem;border-top:1px solid var(--border);display:flex;gap:0.75rem;flex-shrink:0;background:var(--surface2)}
.btn-primary{flex:1;display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;padding:0.7rem 1rem;border-radius:7px;font-family:var(--mono);font-size:0.65rem;letter-spacing:0.06em;text-transform:uppercase;transition:background 0.15s;border:none;cursor:pointer}
.btn-primary:hover{background:#8a3008}
.btn-secondary{display:block;text-align:center;background:none;color:var(--ink3);text-decoration:none;padding:0.7rem 1rem;border-radius:7px;font-family:var(--mono);font-size:0.65rem;letter-spacing:0.06em;text-transform:uppercase;transition:all 0.15s;border:1px solid var(--border);white-space:nowrap}
.btn-secondary:hover{border-color:var(--border2);color:var(--ink)}

.empty{grid-column:1/-1;padding:5rem 2rem;text-align:center;font-family:var(--mono);font-size:0.75rem;color:var(--ink3)}
@media(max-width:600px){
  .header-inner{padding:0 1rem;gap:0.75rem}
  .search-box,.header-date{display:none}
  .grid-wrap,.statsbar{padding-left:1rem;padding-right:1rem}
  .loader{margin-left:1rem;margin-right:1rem}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Briefing<span>.</span></div>
    <div class="live-badge"><span class="dot"></span>LIVE</div>
    <div class="header-date" id="hdate">—</div>
    <div class="search-box">
      <svg class="search-ico" viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="4"/><line x1="10" y1="10" x2="14" y2="14"/></svg>
      <input type="text" id="search" placeholder="Pesquisar…">
    </div>
    <button class="refresh-btn" id="rbtn">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M1.5 8A6.5 6.5 0 1 0 8 1.5"/><polyline points="1.5,1.5 1.5,8 8,8"/></svg>
      Atualizar
    </button>
  </div>
</header>

<nav class="theme-nav">
  <div class="theme-nav-inner" id="tnav">
    <button class="tbtn active" data-t="all">Tudo</button>
    <button class="tbtn" data-t="macro">Macro &amp; Mercados</button>
    <button class="tbtn" data-t="micro">Micro &amp; Finanças</button>
    <button class="tbtn" data-t="intl">Política Internacional</button>
    <button class="tbtn" data-t="inov">Inovação &amp; Empresas</button>
    <button class="tbtn" data-t="pteco">Economia PT</button>
    <button class="tbtn" data-t="ptpol">Política PT</button>
  </div>
</nav>

<div class="statsbar" id="stats">
  <div class="stat"><span class="stat-n" id="sart">0</span><span class="stat-l">artigos</span></div>
  <div class="sdivider"></div>
  <div class="stat"><span class="stat-n" id="ssrc">0</span><span class="stat-l">fontes activas</span></div>
  <div class="sdivider"></div>
  <div class="stat"><span class="stat-l">actualizado</span>&nbsp;<span class="stat-n" style="font-size:0.76rem" id="supd">—</span></div>
</div>

<div class="loader" id="loader">
  <div class="spin-sm"></div>
  <span id="ltxt">A carregar notícias…</span>
  <div class="progress-bar-wrap"><div class="progress-bar" id="pbar"></div></div>
</div>

<div class="grid-wrap"><div class="grid" id="grid"></div></div>

<!-- DRAWER -->
<div class="drawer-overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div style="flex:1;min-width:0">
      <div class="drawer-source" id="d-source">—</div>
      <div class="drawer-title" id="d-title">—</div>
    </div>
    <button class="drawer-close" id="drawer-close" aria-label="Fechar">✕</button>
  </div>
  <div class="drawer-body">
    <div class="drawer-meta" id="d-meta"></div>
    <div id="d-body"></div>
  </div>
  <div class="drawer-footer">
    <a class="btn-primary" id="d-link" href="#" target="_blank" rel="noopener">Ler artigo completo →</a>
    <button class="btn-secondary" id="drawer-close2">Fechar</button>
  </div>
</aside>

<script>
// ── PROXIES em cascata ──
const PROXIES = [
  u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
];

async function fetchRaw(url) {
  for (const mk of PROXIES) {
    try {
      const r = await fetch(mk(url), { signal: AbortSignal.timeout(7000) });
      if (!r.ok) continue;
      const ct = r.headers.get('content-type') || '';
      if (ct.includes('json')) {
        const j = await r.json();
        if (j?.contents) return j.contents;
        continue;
      }
      const t = await r.text();
      if (t && (t.includes('<rss') || t.includes('<feed') || t.includes('<channel'))) return t;
    } catch { continue; }
  }
  try {
    const r = await fetch(url, { signal: AbortSignal.timeout(5000) });
    if (r.ok) return await r.text();
  } catch {}
  return null;
}

function parseRSS(xml, label, themes) {
  try {
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    const items = Array.from(doc.querySelectorAll('item')).slice(0, 8);
    return items.map(el => {
      const g = t => el.querySelector(t)?.textContent?.trim() || '';
      const link = g('link') || el.querySelector('guid')?.textContent?.trim() || '#';
      // Extrai conteúdo completo disponível
      const rawContent = g('content\\:encoded') || g('description') || '';
      const div = document.createElement('div');
      div.innerHTML = rawContent;
      // Parágrafos completos para o drawer
      const paragraphs = Array.from(div.querySelectorAll('p'))
        .map(p => p.textContent.trim()).filter(Boolean).slice(0, 5);
      const fullText = paragraphs.length
        ? paragraphs
        : [div.textContent.replace(/\s+/g,' ').trim()].filter(Boolean);
      const shortDesc = (fullText[0] || '').slice(0, 180);
      return {
        title: g('title').replace(/\s+/g,' '),
        link,
        shortDesc,
        fullContent: fullText,
        date: g('pubDate') || g('dc\\:date') || '',
        author: g('author') || g('dc\\:creator') || '',
        source: label,
        themes,
      };
    }).filter(a => a.title && a.link !== '#');
  } catch { return []; }
}

// ── FEEDS — apenas os mais fiáveis, todos paralelos ──
const FEEDS = [
  // MACRO & MERCADOS
  { label:'BBC Business',          url:'https://feeds.bbci.co.uk/news/business/rss.xml',              themes:['macro','micro'] },
  { label:'The Guardian Business', url:'https://www.theguardian.com/uk/business/rss',                 themes:['macro'] },
  { label:'CNBC Economy',          url:'https://www.cnbc.com/id/20910258/device/rss/rss.html',        themes:['macro'] },
  { label:'CNBC Finance',          url:'https://www.cnbc.com/id/10000664/device/rss/rss.html',        themes:['macro','micro'] },
  { label:'DW Economy',            url:'https://rss.dw.com/rdf/rss-en-eco',                           themes:['macro'] },
  { label:'VOA Business',          url:'https://www.voanews.com/rss?section=/economy-business',       themes:['macro'] },
  { label:'Al Jazeera',            url:'https://www.aljazeera.com/xml/rss/all.xml',                   themes:['macro','intl'] },
  { label:'The Economist Finance', url:'https://www.economist.com/finance-and-economics/rss.xml',     themes:['macro','micro'] },

  // MICRO & FINANÇAS
  { label:'HBR Economics',         url:'https://hbr.org/feed/topic/economics',                        themes:['micro'] },
  { label:'HBR Strategy',          url:'https://hbr.org/feed/topic/strategy',                         themes:['micro'] },
  { label:'Forbes Finance',        url:'https://www.forbes.com/investing/feed2/',                     themes:['micro','macro'] },
  { label:'Investopedia',          url:'https://www.investopedia.com/feedbuilder/feed/getfeed?feedName=rss_headline', themes:['micro','macro'] },
  { label:'The Economist Business',url:'https://www.economist.com/business/rss.xml',                  themes:['micro'] },

  // POLÍTICA INTERNACIONAL
  { label:'BBC World',             url:'https://feeds.bbci.co.uk/news/world/rss.xml',                 themes:['intl'] },
  { label:'The Guardian World',    url:'https://www.theguardian.com/world/rss',                       themes:['intl'] },
  { label:'DW World',              url:'https://rss.dw.com/rdf/rss-en-all',                           themes:['intl'] },
  { label:'VOA World',             url:'https://www.voanews.com/rss?section=/world-news',             themes:['intl'] },
  { label:'Foreign Policy',        url:'https://foreignpolicy.com/feed/',                             themes:['intl'] },
  { label:'The Economist World',   url:'https://www.economist.com/international/rss.xml',             themes:['intl'] },

  // INOVAÇÃO & EMPRESAS
  { label:'TechCrunch',            url:'https://techcrunch.com/feed/',                                themes:['inov'] },
  { label:'Ars Technica',          url:'https://feeds.arstechnica.com/arstechnica/index',             themes:['inov'] },
  { label:'Wired',                 url:'https://www.wired.com/feed/rss',                              themes:['inov'] },
  { label:'MIT Tech Review',       url:'https://www.technologyreview.com/feed/',                      themes:['inov'] },
  { label:'The Verge',             url:'https://www.theverge.com/rss/index.xml',                      themes:['inov'] },

  // ECONOMIA PT
  { label:'Jornal de Negócios',    url:'https://www.jornaldenegocios.pt/rss',                        themes:['pteco'] },
  { label:'ECO',                   url:'https://eco.pt/feed/',                                        themes:['pteco'] },
  { label:'Jornal Económico',      url:'https://jornaleconomico.pt/feed/',                            themes:['pteco'] },
  { label:'Dinheiro Vivo',         url:'https://www.dinheirovivo.pt/feed/',                           themes:['pteco'] },
  { label:'Banco de Portugal',     url:'https://www.bportugal.pt/rss.xml',                           themes:['pteco'] },

  // POLÍTICA PT
  { label:'Público',               url:'https://feeds.feedburner.com/PublicoRSS',                    themes:['ptpol','pteco'] },
  { label:'Expresso',              url:'https://expresso.pt/rss',                                    themes:['ptpol','pteco'] },
  { label:'Observador',            url:'https://observador.pt/feed/',                                themes:['ptpol'] },
  { label:'RTP Notícias',          url:'https://www.rtp.pt/noticias/rss',                            themes:['ptpol'] },
  { label:'Notícias ao Minuto',    url:'https://www.noticiasaominuto.com/rss/ultima-hora',           themes:['ptpol','pteco'] },
];

const THEME_LABELS = {
  all:'Tudo', macro:'Macro & Mercados', micro:'Micro & Finanças',
  intl:'Política Internacional', inov:'Inovação & Empresas',
  pteco:'Economia PT', ptpol:'Política PT'
};

let cache = {};
let activeTheme = 'all';
let searchQ = '';
let loadedCount = 0;

// ── DRAWER ──
function openDrawer(a) {
  document.getElementById('d-source').textContent = a.source;
  document.getElementById('d-title').textContent = a.title;
  document.getElementById('d-link').href = a.link;

  // Meta
  const meta = [];
  if (a.date) meta.push(`<span class="drawer-meta-item">🕒 ${formatDate(a.date)}</span>`);
  if (a.author) meta.push(`<span class="drawer-meta-item">✍ ${a.author}</span>`);
  meta.push(`<span class="drawer-meta-item">📰 ${a.source}</span>`);
  document.getElementById('d-meta').innerHTML = meta.join('');

  // Corpo — conteúdo completo do feed
  let bodyHtml = '';
  if (a.fullContent && a.fullContent.length) {
    bodyHtml += `<div class="drawer-label">Conteúdo disponível</div>`;
    bodyHtml += `<div class="drawer-content">`;
    a.fullContent.forEach(p => {
      if (p.trim()) bodyHtml += `<p>${p}</p>`;
    });
    bodyHtml += `</div>`;
    bodyHtml += `<hr class="drawer-divider">`;
  }
  bodyHtml += `<div class="drawer-label">Fonte</div>`;
  bodyHtml += `<div style="font-family:var(--mono);font-size:0.68rem;color:var(--ink3);word-break:break-all">${a.link}</div>`;
  document.getElementById('d-body').innerHTML = bodyHtml;

  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('drawer-close').addEventListener('click', closeDrawer);
document.getElementById('drawer-close2').addEventListener('click', closeDrawer);
document.getElementById('overlay').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

// ── CARREGAMENTO — todos em paralelo ──
async function loadFeed(feed) {
  const xml = await fetchRaw(feed.url);
  loadedCount++;
  const pct = Math.round((loadedCount / FEEDS.length) * 100);
  document.getElementById('pbar').style.width = pct + '%';
  if (!xml) return null;
  const articles = parseRSS(xml, feed.label, feed.themes);
  return articles.length ? { label: feed.label, themes: feed.themes, articles } : null;
}

async function loadAll() {
  loadedCount = 0;
  cache = {};
  document.getElementById('pbar').style.width = '0%';
  setLoader(true, 'A carregar notícias…');
  document.getElementById('rbtn').classList.add('loading');
  document.getElementById('stats').classList.remove('visible');
  document.getElementById('grid').innerHTML = '';

  // Todos em paralelo — muito mais rápido
  const results = await Promise.allSettled(FEEDS.map(loadFeed));
  results.forEach(r => {
    if (r.status === 'fulfilled' && r.value) cache[r.value.label] = r.value;
  });

  document.getElementById('supd').textContent =
    new Date().toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' });
  setLoader(false);
  document.getElementById('rbtn').classList.remove('loading');
  document.getElementById('stats').classList.add('visible');
  render();
}

function getVisible() {
  let feeds = Object.values(cache);
  if (activeTheme !== 'all') feeds = feeds.filter(f => f.themes.includes(activeTheme));
  if (searchQ) {
    const q = searchQ.toLowerCase();
    feeds = feeds.map(f => ({
      ...f,
      articles: f.articles.filter(a =>
        a.title.toLowerCase().includes(q) || a.shortDesc.toLowerCase().includes(q)
      )
    })).filter(f => f.articles.length);
  }
  return feeds.sort((a,b) => new Date(b.articles[0]?.date||0) - new Date(a.articles[0]?.date||0));
}

function timeAgo(d) {
  if (!d) return '';
  const s = (Date.now() - new Date(d)) / 1000;
  if (isNaN(s)||s<0) return '';
  if (s < 60) return 'agora';
  if (s < 3600) return Math.floor(s/60) + 'min';
  if (s < 86400) return Math.floor(s/3600) + 'h';
  return Math.floor(s/86400) + 'd';
}

function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleString('pt-PT', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

function render() {
  const grid = document.getElementById('grid');
  const feeds = getVisible();
  grid.innerHTML = '';

  let total = 0;
  feeds.forEach(f => total += f.articles.length);
  document.getElementById('sart').textContent = total;
  document.getElementById('ssrc').textContent = feeds.length;

  if (!feeds.length) {
    grid.innerHTML = '<div class="empty">Sem resultados para este filtro.</div>';
    return;
  }

  feeds.forEach((feed, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (i === 0 ? ' wide' : '');
    card.style.animationDelay = (i * 0.03) + 's';
    card.innerHTML = `<div class="card-head"><span class="src-label">${feed.label}</span><span class="src-count">${feed.articles.length}</span></div>`;

    const body = document.createElement('div');
    body.className = 'card-body';

    feed.articles.slice(0, i === 0 ? 5 : 4).forEach(a => {
      const el = document.createElement('div');
      el.className = 'art';
      el.innerHTML = `
        <div class="art-title">${a.title}</div>
        ${a.shortDesc ? `<div class="art-desc">${a.shortDesc}</div>` : ''}
        <div class="art-footer">
          <span class="art-time">${timeAgo(a.date)}</span>
          ${THEME_LABELS[a.themes[0]] ? `<span class="art-tag">${THEME_LABELS[a.themes[0]]}</span>` : ''}
          <button class="art-read-btn">Ver detalhes →</button>
        </div>`;

      el.querySelector('.art-read-btn').addEventListener('click', e => {
        e.stopPropagation();
        openDrawer(a);
      });
      el.addEventListener('click', () => openDrawer(a));
      body.appendChild(el);
    });

    card.appendChild(body);
    grid.appendChild(card);
  });
}

function setLoader(show, msg) {
  document.getElementById('loader').classList.toggle('hidden', !show);
  if (msg) document.getElementById('ltxt').textContent = msg;
}

function tick() {
  document.getElementById('hdate').textContent =
    new Date().toLocaleDateString('pt-PT', { weekday:'short', day:'numeric', month:'short' }) + ' · ' +
    new Date().toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' });
}
tick();
setInterval(tick, 30000);

document.getElementById('tnav').addEventListener('click', e => {
  const b = e.target.closest('.tbtn');
  if (!b) return;
  document.querySelectorAll('.tbtn').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  activeTheme = b.dataset.t;
  render();
});
document.getElementById('rbtn').addEventListener('click', loadAll);
document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value.trim();
  render();
});

setInterval(loadAll, 30 * 60 * 1000);
loadAll();
</script>
</body>
</html>
