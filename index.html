<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0c0d0f;--surface:#141519;--surface2:#1c1e24;--surface3:#22252d;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);
  --text:#ededeb;--muted:#7a7a80;--muted2:#55555c;
  --accent:#e6b84a;--green:#4ade80;
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:14px}
header{position:sticky;top:0;z-index:200;background:rgba(12,13,15,0.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1480px;margin:0 auto;padding:0 1.75rem;display:flex;align-items:center;gap:1.25rem;height:52px}
.logo{font-family:var(--serif);font-size:1.45rem;color:var(--text);white-space:nowrap;letter-spacing:-0.01em}
.logo span{color:var(--accent)}
.live-badge{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:0.6rem;color:var(--green);letter-spacing:0.08em;white-space:nowrap}
.dot{width:5px;height:5px;background:var(--green);border-radius:50%;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.header-date{font-family:var(--mono);font-size:0.62rem;color:var(--muted);white-space:nowrap}
.search-box{flex:1;max-width:300px;margin-left:auto;position:relative}
.search-box input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:0.42rem 0.75rem 0.42rem 2rem;font-family:var(--sans);font-size:0.8rem;color:var(--text);outline:none;transition:border-color 0.2s}
.search-box input:focus{border-color:var(--border2)}
.search-box input::placeholder{color:var(--muted2)}
.search-ico{position:absolute;left:0.55rem;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.refresh-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:0.38rem 0.85rem;font-family:var(--mono);font-size:0.62rem;letter-spacing:0.05em;color:var(--muted);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
.refresh-btn.loading svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.theme-nav{background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.theme-nav::-webkit-scrollbar{display:none}
.theme-nav-inner{max-width:1480px;margin:0 auto;padding:0 1.75rem;display:flex}
.tbtn{flex-shrink:0;font-family:var(--mono);font-size:0.62rem;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;padding:0.8rem 1rem;cursor:pointer;transition:all 0.18s;white-space:nowrap}
.tbtn:hover{color:var(--text)}
.tbtn.active{color:var(--accent);border-bottom-color:var(--accent)}
.statsbar{max-width:1480px;margin:0 auto;padding:1.1rem 1.75rem 0;display:flex;gap:1.25rem;align-items:center;flex-wrap:wrap;opacity:0;transition:opacity 0.4s}
.statsbar.visible{opacity:1}
.stat{display:flex;align-items:baseline;gap:5px;font-family:var(--mono);font-size:0.62rem}
.stat-n{font-size:1.05rem;font-weight:500;color:var(--accent)}
.stat-l{color:var(--muted)}
.sdivider{width:1px;height:16px;background:var(--border2)}
.loader{max-width:1480px;margin:1rem 1.75rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0.7rem 1rem;display:flex;align-items:center;gap:0.6rem;font-family:var(--mono);font-size:0.68rem;color:var(--muted)}
.loader.hidden{display:none}
.spin-sm{width:13px;height:13px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0}
.progress{font-family:var(--mono);font-size:0.62rem;color:var(--accent);margin-left:auto}
.grid-wrap{max-width:1480px;margin:0 auto;padding:1.25rem 1.75rem 5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color 0.2s,transform 0.2s;animation:fadeUp 0.35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card:hover{border-color:var(--border2);transform:translateY(-1px)}
.card.wide{grid-column:span 2}
@media(max-width:680px){.card.wide{grid-column:span 1}}
.card-head{padding:0.85rem 1.1rem 0.7rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
.src-label{font-family:var(--mono);font-size:0.6rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent)}
.src-count{font-family:var(--mono);font-size:0.58rem;color:var(--muted2);background:var(--surface2);padding:0.18rem 0.45rem;border-radius:4px}
.card-body{padding:0.15rem 0}
.art{padding:0.7rem 1.1rem;border-bottom:1px solid var(--border);transition:background 0.15s}
.art:last-child{border-bottom:none}
.art:hover{background:var(--surface2)}
.art-title{font-family:var(--serif);font-size:0.9rem;line-height:1.38;color:var(--text);text-decoration:none;display:block;margin-bottom:0.28rem}
.art-title:hover{color:var(--accent)}
.art-desc{font-size:0.73rem;color:var(--muted);line-height:1.5;margin-bottom:0.3rem;font-weight:300;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art-meta{display:flex;align-items:center;gap:0.45rem;flex-wrap:wrap}
.art-time{font-family:var(--mono);font-size:0.58rem;color:var(--muted2)}
.art-tag{font-family:var(--mono);font-size:0.56rem;padding:0.12rem 0.4rem;border-radius:3px;background:var(--surface3);color:var(--muted);border:1px solid var(--border)}
.empty{grid-column:1/-1;padding:5rem 2rem;text-align:center;font-family:var(--mono);font-size:0.75rem;color:var(--muted)}
@media(max-width:580px){
  .header-inner{padding:0 1rem;gap:0.75rem}
  .search-box,.header-date{display:none}
  .grid-wrap,.statsbar{padding-left:1rem;padding-right:1rem}
  .loader{margin-left:1rem;margin-right:1rem}
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">Briefing<span>.</span></div>
    <div class="live-badge"><span class="dot"></span>LIVE</div>
    <div class="header-date" id="hdate">—</div>
    <div class="search-box">
      <svg class="search-ico" viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="4"/><line x1="10" y1="10" x2="14" y2="14"/></svg>
      <input type="text" id="search" placeholder="Pesquisar…">
    </div>
    <button class="refresh-btn" id="rbtn">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M1.5 8A6.5 6.5 0 1 0 8 1.5"/><polyline points="1.5,1.5 1.5,8 8,8"/></svg>
      Atualizar
    </button>
  </div>
</header>
<nav class="theme-nav">
  <div class="theme-nav-inner" id="tnav">
    <button class="tbtn active" data-t="all">Tudo</button>
    <button class="tbtn" data-t="macro">Macro &amp; Mercados</button>
    <button class="tbtn" data-t="micro">Micro &amp; Finanças</button>
    <button class="tbtn" data-t="intl">Política Internacional</button>
    <button class="tbtn" data-t="inov">Inovação &amp; Empresas</button>
    <button class="tbtn" data-t="pteco">Economia PT</button>
    <button class="tbtn" data-t="ptpol">Política PT</button>
  </div>
</nav>
<div class="statsbar" id="stats">
  <div class="stat"><span class="stat-n" id="sart">0</span><span class="stat-l">artigos</span></div>
  <div class="sdivider"></div>
  <div class="stat"><span class="stat-n" id="ssrc">0</span><span class="stat-l">fontes</span></div>
  <div class="sdivider"></div>
  <div class="stat"><span class="stat-l">actualizado</span>&nbsp;<span class="stat-n" style="font-size:0.78rem" id="supd">—</span></div>
</div>
<div class="loader" id="loader">
  <div class="spin-sm"></div>
  <span id="ltxt">A carregar notícias…</span>
  <span class="progress" id="lprog"></span>
</div>
<div class="grid-wrap"><div class="grid" id="grid"></div></div>

<script>
// ── PROXIES em cascata: tenta cada um até encontrar um que funcione ──
const PROXIES = [
  url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
];

async function fetchRaw(url) {
  for (const makeUrl of PROXIES) {
    try {
      const res = await fetch(makeUrl(url), { signal: AbortSignal.timeout(8000) });
      if (!res.ok) continue;
      const data = await res.json().catch(() => null);
      // allorigins devolve { contents: "..." }
      if (data && data.contents) return data.contents;
      // codetabs e corsproxy devolvem texto directo
      const text = await res.text().catch(() => null);
      if (text && text.trim().startsWith('<')) return text;
    } catch(e) { continue; }
  }
  // fallback: tenta fetch directo (funciona se o feed tiver CORS aberto)
  try {
    const res = await fetch(url, { signal: AbortSignal.timeout(6000) });
    if (res.ok) return await res.text();
  } catch(e) {}
  return null;
}

function parseRSS(xmlStr, sourceLabel, themes) {
  try {
    const doc = new DOMParser().parseFromString(xmlStr, 'text/xml');
    const items = Array.from(doc.querySelectorAll('item')).slice(0, 10);
    return items.map(item => {
      const get = tag => item.querySelector(tag)?.textContent?.trim() || '';
      const link = get('link') || item.querySelector('guid')?.textContent?.trim() || '#';
      const rawDesc = get('description');
      const div = document.createElement('div');
      div.innerHTML = rawDesc;
      const desc = div.textContent.replace(/\s+/g,' ').trim().slice(0, 150);
      return {
        title: get('title').replace(/\s+/g,' '),
        link,
        desc,
        date: get('pubDate') || get('dc\\:date') || '',
        source: sourceLabel,
        themes,
      };
    }).filter(a => a.title && a.link !== '#');
  } catch(e) { return []; }
}

// ── FEEDS — URLs RSS que realmente existem e são públicos ──
const FEEDS = [
  // MACRO & MERCADOS
  { label:'Euronews Business',   url:'https://www.euronews.com/rss?level=theme&name=business',                themes:['macro','intl'] },
  { label:'Euronews',            url:'https://feeds.feedburner.com/euronews/en/news/',                        themes:['macro','intl'] },
  { label:'Reuters (Yahoo)',     url:'https://finance.yahoo.com/news/rssindex',                               themes:['macro','micro'] },
  { label:'Yahoo Finance',       url:'https://finance.yahoo.com/rss/topstories',                              themes:['macro'] },
  { label:'MarketWatch',         url:'https://feeds.content.dowjones.io/public/rss/mw_realtimeheadlines',     themes:['macro'] },
  { label:'Seeking Alpha',       url:'https://seekingalpha.com/market_currents.xml',                         themes:['macro'] },
  { label:'Project Syndicate',   url:'https://www.project-syndicate.org/rss',                                 themes:['macro','intl'] },
  { label:'VoxEU',               url:'https://cepr.org/rss.xml',                                             themes:['macro','micro'] },
  { label:'IMF Blog',            url:'https://www.imf.org/en/Blogs/rss',                                     themes:['macro'] },
  { label:'World Bank',          url:'https://blogs.worldbank.org/en/rss.xml',                               themes:['macro','intl'] },

  // MICRO & FINANÇAS
  { label:'HBR Management',      url:'https://hbr.org/feed',                                                  themes:['micro'] },
  { label:'Bruegel',             url:'https://www.bruegel.org/rss.xml',                                      themes:['micro','macro'] },
  { label:'NBER',                url:'https://www.nber.org/rss/new_working_papers.rss',                      themes:['micro','macro'] },

  // POLÍTICA INTERNACIONAL
  { label:'Foreign Affairs',     url:'https://www.foreignaffairs.com/rss.xml',                               themes:['intl'] },
  { label:'Council on Foreign Relations', url:'https://www.cfr.org/rss/all',                                themes:['intl'] },
  { label:'AP World',            url:'https://rss.ap.org/topnews',                                           themes:['intl','macro'] },

  // INOVAÇÃO & EMPRESAS
  { label:'TechCrunch',          url:'https://techcrunch.com/feed/',                                         themes:['inov'] },
  { label:'MIT Tech Review',     url:'https://www.technologyreview.com/feed/',                               themes:['inov'] },
  { label:'Ars Technica',        url:'https://feeds.arstechnica.com/arstechnica/index',                      themes:['inov'] },
  { label:'Wired',               url:'https://www.wired.com/feed/rss',                                       themes:['inov'] },

  // ECONOMIA PT
  { label:'Jornal de Negócios',  url:'https://www.jornaldenegocios.pt/rss',                                  themes:['pteco'] },
  { label:'ECO',                 url:'https://eco.pt/feed/',                                                 themes:['pteco'] },
  { label:'Jornal Económico',    url:'https://jornaleconomico.pt/feed/',                                     themes:['pteco'] },
  { label:'Banco de Portugal',   url:'https://www.bportugal.pt/rss.xml',                                    themes:['pteco'] },

  // POLÍTICA PT
  { label:'Público',             url:'https://feeds.feedburner.com/PublicoRSS',                             themes:['ptpol','pteco'] },
  { label:'Expresso',            url:'https://expresso.pt/rss',                                             themes:['ptpol','pteco'] },
  { label:'Observador',          url:'https://observador.pt/feed/',                                         themes:['ptpol','pteco'] },
  { label:'SIC Notícias',        url:'https://sicnoticias.pt/rss',                                          themes:['ptpol'] },
];

const THEME_LABELS = {
  all:'Tudo', macro:'Macro & Mercados', micro:'Micro & Finanças',
  intl:'Política Internacional', inov:'Inovação & Empresas',
  pteco:'Economia PT', ptpol:'Política PT'
};

let cache = {};
let activeTheme = 'all';
let searchQ = '';
let loaded = 0;

async function loadFeed(feed) {
  const xml = await fetchRaw(feed.url);
  loaded++;
  document.getElementById('lprog').textContent = `${loaded}/${FEEDS.length}`;
  if (!xml) return null;
  const articles = parseRSS(xml, feed.label, feed.themes);
  if (!articles.length) return null;
  return { label: feed.label, themes: feed.themes, articles };
}

async function loadAll() {
  loaded = 0;
  cache = {};
  document.getElementById('lprog').textContent = `0/${FEEDS.length}`;
  setLoader(true, 'A carregar notícias…');
  document.getElementById('rbtn').classList.add('loading');
  document.getElementById('stats').classList.remove('visible');

  // Carrega em lotes de 5 para não sobrecarregar os proxies
  const results = [];
  for (let i = 0; i < FEEDS.length; i += 5) {
    const batch = FEEDS.slice(i, i + 5);
    const batchResults = await Promise.allSettled(batch.map(loadFeed));
    results.push(...batchResults);
    // Render parcial à medida que chegam resultados
    batchResults.forEach(r => {
      if (r.status === 'fulfilled' && r.value) {
        cache[r.value.label] = r.value;
      }
    });
    render();
  }

  document.getElementById('supd').textContent =
    new Date().toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' });

  setLoader(false);
  document.getElementById('rbtn').classList.remove('loading');
  document.getElementById('stats').classList.add('visible');
  render();
}

function getVisible() {
  let feeds = Object.values(cache);
  if (activeTheme !== 'all') feeds = feeds.filter(f => f.themes.includes(activeTheme));

  if (searchQ) {
    const q = searchQ.toLowerCase();
    feeds = feeds.map(f => ({
      ...f,
      articles: f.articles.filter(a =>
        (a.title||'').toLowerCase().includes(q) ||
        (a.desc||'').toLowerCase().includes(q)
      )
    })).filter(f => f.articles.length > 0);
  }

  return feeds.sort((a,b) => {
    const ta = new Date(a.articles[0]?.date || 0);
    const tb = new Date(b.articles[0]?.date || 0);
    return tb - ta;
  });
}

function timeAgo(d) {
  if (!d) return '';
  const s = (Date.now() - new Date(d)) / 1000;
  if (isNaN(s) || s < 0) return '';
  if (s < 60) return 'agora';
  if (s < 3600) return Math.floor(s/60) + 'min';
  if (s < 86400) return Math.floor(s/3600) + 'h';
  return Math.floor(s/86400) + 'd';
}

function render() {
  const grid = document.getElementById('grid');
  const feeds = getVisible();
  grid.innerHTML = '';

  let totalArts = 0;
  feeds.forEach(f => totalArts += f.articles.length);
  document.getElementById('sart').textContent = totalArts;
  document.getElementById('ssrc').textContent = feeds.length;

  if (feeds.length === 0) {
    if (!document.getElementById('loader').classList.contains('hidden')) return;
    grid.innerHTML = '<div class="empty">Sem resultados para este filtro.</div>';
    return;
  }

  feeds.forEach((feed, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (i === 0 ? ' wide' : '');
    card.style.animationDelay = (i * 0.04) + 's';

    const head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML = `<span class="src-label">${feed.label}</span><span class="src-count">${feed.articles.length}</span>`;
    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'card-body';

    const limit = i === 0 ? 6 : 4;
    feed.articles.slice(0, limit).forEach(a => {
      const el = document.createElement('div');
      el.className = 'art';
      const tag = THEME_LABELS[a.themes[0]] || '';
      el.innerHTML = `
        <a class="art-title" href="${a.link}" target="_blank" rel="noopener">${a.title}</a>
        ${a.desc ? `<div class="art-desc">${a.desc}</div>` : ''}
        <div class="art-meta">
          <span class="art-time">${timeAgo(a.date)}</span>
          ${tag ? `<span class="art-tag">${tag}</span>` : ''}
        </div>`;
      body.appendChild(el);
    });

    card.appendChild(body);
    grid.appendChild(card);
  });
}

function setLoader(show, msg) {
  document.getElementById('loader').classList.toggle('hidden', !show);
  if (msg) document.getElementById('ltxt').textContent = msg;
}

function tick() {
  document.getElementById('hdate').textContent =
    new Date().toLocaleDateString('pt-PT', { weekday:'short', day:'numeric', month:'short' }) + ' · ' +
    new Date().toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' });
}
tick();
setInterval(tick, 30000);

document.getElementById('tnav').addEventListener('click', e => {
  const btn = e.target.closest('.tbtn');
  if (!btn) return;
  document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeTheme = btn.dataset.t;
  render();
});

document.getElementById('rbtn').addEventListener('click', loadAll);

document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value.trim();
  render();
});

setInterval(loadAll, 30 * 60 * 1000);
loadAll();
</script>
</body>
</html>
